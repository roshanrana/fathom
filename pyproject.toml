[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fathom"
version = "0.1.0"
description = "Fathom summarises public SEC filings and market data to prepare an advisor for a client conversation."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "streamlit>=1.38",
    "plotly>=5.22",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyarrow>=16",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pandas-stubs",
    "pyarrow-stubs",
]
mcp = [
    "mcp>=1.9,<2",
]
screenshots = [
    "playwright>=1.45",
]

[tool.hatch.build.targets.wheel]
packages = ["fathom"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/shipyard", "scripts/fetch_data.py", "metrics", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["fathom"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
